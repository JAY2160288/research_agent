[project]
name = "research-agent"
version = "0.1.0"
description = "AI Research Agent — 연구 주제를 입력받아 문헌 조사·평가·종합·Research Gap 제안을 수행하는 에이전트"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "diskcache>=5.6.3",
    "httpx>=0.28.1",
    "pydantic>=2.11",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.2",
    "typer>=0.15",
]

[project.scripts]
agent = "research_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
