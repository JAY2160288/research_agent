# 테스트 주제 5개 (plan.md §6.1). 분야 분산 + 한국어/영어 입력 혼합. 각 주제는 ko / en 두 버전.
# priority: 중요도 (작을수록 중요, 없으면 맨 뒤). run_ablation.py 가 --topics 없이 돌 때 이 순서로 실행한다.
# id 는 실행 기록(runs/*/ablation.json 의 topic_id)과 묶여 있으므로 주제를 추가·삭제해도 재번호하지 않는다.
# T5 (전기차 보조금, 한국어만) 는 2026-10-06 삭제 — 결번.
topics:
  - id: T1
    priority: 1
    domain: education
    note: 지침 예시 (기준점)
    ko: 생성형 AI 활용이 대학원생의 연구 생산성과 연구 품질에 미치는 영향
    en: The impact of generative AI use on graduate students' research productivity and research quality

  - id: T6
    priority: 2
    domain: NLP / computational linguistics
    note: 본인 연구 관심 주제 (2026-10-06 추가). "X 가 Y 에 미치는 영향" 꼴이 아닌 짧고 열린 주제 — understand 노드의 범위 설정 테스트
    ko: 한국어 토크나이징 방법 개선
    en: Improving tokenization methods for Korean

  - id: T2
    domain: computer science
    note: arXiv 비중 높음, 수업 연계
    ko: LLM 에이전트의 장기 메모리 설계가 멀티스텝 과업 성공률에 미치는 영향
    en: How long-term memory design in LLM agents affects success rates on multi-step tasks

  - id: T3
    domain: accounting
    note: 본인 도메인 — 품질을 직접 판단 가능
    ko: AI 기반 이상거래 탐지가 외부감사 품질과 감사 비용에 미치는 영향
    en: The effect of AI-based anomaly detection on external audit quality and audit fees

  - id: T4
    domain: public health
    note: 임상 문헌 — RCT 등 방법론 필드 테스트
    ko: 디지털 치료제의 우울증 증상 완화 효과와 지속성
    en: Efficacy and durability of digital therapeutics for reducing depressive symptoms
