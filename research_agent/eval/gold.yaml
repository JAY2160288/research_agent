# 정답 서베이 (gold surveys) — 주제별 "참고문헌 회수율" 의 정답 집합 (plan.md §6.2, ADR-10).
#
# 방식은 ReportBench (arXiv 서베이를 정답으로) 를 따른다: 사람이 쓴 체계적 문헌고찰·서베이의 참고문헌 목록을
# 그 주제의 "찾았어야 할 문헌" 으로 보고, 우리 실행이 그중 몇 편을 (검색 → 평가 → 인용 단계별로) 건졌는지 센다.
# 절대값은 낮을 수밖에 없다 — 우리는 sub-RQ 당 12편만 선별하고 초록만 본다. 조건(A~D) 간 **상대 비교**와
# "Replan 이 회수율을 올렸는가" 를 보는 지표다. LLM 비용 0, 결정적.
#
# 선정 기준: OpenAlex 에서 주제 영문 문장으로 검색해 참고문헌 20편 이상인 리뷰/서베이 중 주제와 가장 가까운 것 (2026-10-07).
# 참고문헌 목록은 scripts/gold_recall.py 가 OpenAlex `referenced_works` 로 한 번 받아 eval/gold_refs.json 에 캐시한다
# (평가자는 네트워크 없이 재계산 가능). 주제가 바뀌면 여기만 고치고 `--refresh`.
