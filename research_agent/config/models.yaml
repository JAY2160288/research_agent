# 모델·비용 설정. 모델명만 바꾸면 다른 Claude 모델로 실행됩니다.
# (현 SDK 는 temperature 파라미터를 받지 않음 — 실행 간 편차는 Critic 게이트로 통제, goals.md O7-L3)
#
# 모델 운용 원칙 (비용 절감)
#   - 개발 단계(W2~W3 노드 구현·디버깅): claude-haiku-4-5  — 동작·스키마 통과 확인용. 품질 판단 안 함
#   - 품질 측정(W3 반복 실행, W4 ablation, 제출 run): claude-sonnet-5-5 — `--model` 로 덮어쓰거나 아래 값 교체
#   - LLM-judge: claude-opus-5-5 — 실행 모델과 다른 상위 모델 (자기 채점 편향 완화)
llm:
  model: claude-haiku-4-5           # 개발용. 제출 전 claude-sonnet-5-5 로 교체. `agent models` 로 계정 모델명 확인
  judge_model: claude-opus-5-5      # LLM-judge 전용
  max_tokens: 16384                 # 베이스라인(최종 브리프 JSON 이 8192 에서 잘렸음, 2026-10-04 T1). 16384 는 non-streaming 허용 범위
  node_max_tokens: 6000             # 그래프 노드 호출 상한. Replan 라운드 gap 에서 Haiku 가 7만 자를 쏟다 16384 에서 잘려 JSON 파손 → 3분×2회 낭비 → 10분 상한 초과 (2026-10-04 T1 반복 2회차)
  max_retries: 2                    # 스키마 검증 실패 시 재요청 횟수
  request_timeout_sec: 180          # HTTP 요청 1건 상한 (SDK 기본 600초). evaluate 호출이 7분 넘게 멈춘 사례 (2026-10-04 T1 반복 3회차)
  sdk_max_retries: 2                # 연결 오류·타임아웃·429 자동 재시도 (SDK)

# 1회 실행 상한 (goals.md O6)
limits:
  max_cost_usd: 1.00
  max_minutes: 10
  max_react_steps: 15               # 베이스라인 ReAct 전용

# 비용 계산용 단가 (USD / 1M tokens, Anthropic 공식 API 기준 2026-10). 모델 변경 시 함께 수정
pricing:
  claude-haiku-4-5:   {input: 1.00,  output: 5.00}
  claude-sonnet-5-5:  {input: 2.00,  output: 10.00}
  claude-opus-5-5:    {input: 4.00,  output: 20.00}
  default:            {input: 4.00,  output: 20.00}   # 표에 없는 모델은 보수적으로 Opus 단가 적용

tools:
  openalex_per_query: 15
  arxiv_per_query: 10
  crossref_per_query: 15            # OpenAlex 가 429(일일 크레딧 소진) 등으로 실패한 쿼리는 Crossref works 검색으로 폴백 (ADR-8)
  cache_dir: .cache
  user_agent: "research-agent/0.1 (yonsei DAS6035 hackathon)"
  # 그래프 노드 상한 (plan.md §3.2). 비용의 주요 손잡이는 evaluate_per_subrq × sub-RQ 수
  search_min_per_subrq: 10
  search_workers: 4
  arxiv_max_queries_per_subrq: 2    # arXiv 는 3초/요청 예절 → 과하면 429·타임아웃
  arxiv_interval_sec: 3.0
  arxiv_max_failures: 2             # 연속 실패 시 arXiv 차단. OpenAlex 가 모든 sub-RQ 의 주력이라 결과 구조는 유지됨
  evaluate_per_subrq: 12
  evaluate_batch: 10
  min_relevance: 3
  min_evidence_per_subrq: 3

# 품질 게이트 (plan.md §3.3). ablation 조건: B = critic none, C = deterministic, D = full (최종)
graph:
  critic: full                      # none | deterministic | full (결정적 검사 통과 후 LLM 비판까지)
  max_replans: 2                    # Critic 미달 시 Replan(재검색 → 재평가 → 재종합) 상한. 도달하면 미달 항목을 리포트 §7 에 기재
  replan_budget_fraction: 0.6       # 경과 시간·비용이 상한(limits)의 60% 를 넘으면 Replan 생략 → write. Replan 한 라운드 ≈ 2.5~3분(Haiku) 이라 10분 안에 완주하려면 필요
